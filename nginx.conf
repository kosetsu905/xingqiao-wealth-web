# 基本Nginx配置文件，用于处理单页应用(SPA)路由

server {
    listen 80;
    server_name your_domain.com;  # 替换为实际域名

    root /path/to/your/dist;  # 替换为实际的dist目录路径
    index index.html;

    # 处理静态资源
    location ~* \.(png|jpg|jpeg|gif|svg|css|js|ttf|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # 处理SPA路由
location / {
    root /home/dist;
    index index.html;
    try_files $uri $uri/ /index.html;  # 核心配置
}



    # 代理API请求
    location /api/ {
        proxy_pass http://localhost:8080/;  # 替换为实际的后端API地址
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}